version: "3.9"

services:
  db_central:
    image: postgres:16-alpine
    container_name: nucleo_postgres
    restart: always
    environment:
      POSTGRES_USER: admin_empresa
      POSTGRES_PASSWORD: ClaveSegura2026!
      POSTGRES_DB: nucleo_empresarial
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_empresa -d nucleo_empresarial"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
